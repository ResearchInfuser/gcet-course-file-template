title: gcet-course-file
author: Prashant Kumar Nag
version: 0.0.2
quarto-required: ">=1.4.0"
contributes:
  shortcodes: 
    - signature.lua
  format:
    pdf:
      documentclass: GcetCourseFile
      classoption: ["12pt", "a4paper", "gcetlogo-large"]
      papersize: a4
      pdf-engine: xelatex
      format-resources:
        - GcetCourseFile.cls
      toc: true
      toc-depth: 3
      number-sections: true
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
      include-in-header:
        - partials/in-header.tex
      geometry:
        - inner=1.00in
        - outer=1.00in
        - top=1.10in
        - bottom=1.00in
      colorlinks: true
      citecolor: blue
      linkcolor: blue
      urlcolor: blue
      toclinkcolor: black
      keep-tex: true
